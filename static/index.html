<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neobank demo</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #17191c;
        --muted: #667085;
        --line: #e3e6eb;
        --accent: #0f766e;
        --accent-text: #ffffff;
        --pos: #15803d;
        --neg: #b91c1c;
        --warn-bg: #fff7e6;
        --ok-bg: #eaf7ef;
        --err-bg: #fdecec;
        --qr-bg: #ffffff;
        --qr-fg: #000000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1114;
          --card: #161a1f;
          --text: #e7e9ec;
          --muted: #98a2b3;
          --line: #2a3038;
          --accent: #2dd4bf;
          --accent-text: #04201d;
          --pos: #4ade80;
          --neg: #f87171;
          --warn-bg: #2b2414;
          --ok-bg: #12291c;
          --err-bg: #2f1717;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a { color: var(--accent); text-decoration: none; }
      h3 { font-size: 14px; margin: 16px 0 8px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .selectable { user-select: all; overflow-wrap: anywhere; }
      .muted { color: var(--muted); }
      .top {
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line);
      }
      .brand { font-weight: 700; font-size: 16px; color: var(--text); }
      .top nav { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; }
      .top nav a { color: var(--muted); padding: 4px 2px; }
      .top nav a.active { color: var(--text); border-bottom: 2px solid var(--accent); }
      .account { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        padding: 16px; margin-bottom: 16px; overflow-x: auto;
      }
      .card h2 { margin: 0 0 12px; font-size: 16px; }
      .btn {
        display: inline-block; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
      .btn.danger { color: var(--neg); border-color: var(--neg); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .actions { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; align-items: center; }
      .tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
      .tab { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--muted); font: inherit; }
      .tab.active { color: var(--text); border-bottom: 2px solid var(--accent); }
      .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
      .badge.mock { background: var(--warn-bg); }
      .badge.settled, .badge.active, .badge.executed, .badge.trusted, .badge.approved { color: var(--pos); }
      .badge.awaiting_sca, .badge.under_review, .badge.pending, .badge.submitted, .badge.frozen, .badge.in_progress, .badge.action_required, .badge.review { color: #b45309; }
      .badge.cancelled, .badge.rejected, .badge.failed, .badge.declined, .badge.blocked { color: var(--neg); }
      .pos { color: var(--pos); }
      .neg { color: var(--neg); }
      table.grid { border-collapse: collapse; width: 100%; }
      table.grid th, table.grid td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
      table.grid th { font-weight: 600; color: var(--muted); }
      table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 8px; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field span { font-size: 12px; color: var(--muted); }
      .field input, .field select {
        padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
        background: var(--bg); color: var(--text); font: inherit;
      }
      .field input.invalid { border-color: var(--neg); }
      .field .field-error, .field-error { color: var(--neg); }
      .field .field-hint { color: var(--muted); }
      .check { display: block; margin: 8px 0; }
      .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 8px 0 12px; }
      .stat-label { font-size: 12px; color: var(--muted); }
      .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
      .detail { display: flex; gap: 12px; padding: 4px 0; flex-wrap: wrap; }
      .detail-label { color: var(--muted); min-width: 120px; }
      .notice { padding: 10px 12px; background: var(--warn-bg); border-radius: 6px; margin: 8px 0; }
      .success { padding: 10px 12px; background: var(--ok-bg); border-radius: 6px; margin: 8px 0; }
      .error { padding: 10px 12px; background: var(--err-bg); color: var(--neg); border-radius: 6px; margin: 8px 0; white-space: pre-wrap; }
      .loading { color: var(--muted); margin: 8px 0; }
      .step-open, .step-up, .sandbox {
        border: 1px dashed var(--line); border-radius: 8px; padding: 12px; margin: 12px 0;
      }
      .step-up { border-color: var(--accent); }
      .steps li { margin: 6px 0; }
      .steps li span { margin-right: 8px; }
      .simulated-sdk { padding: 24px; text-align: center; background: var(--bg); border-radius: 6px; margin: 8px 0; }
      .sdk-host:empty { display: none; }
      .balances { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
      .balance { display: block; padding: 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); }
      .balance-currency { color: var(--muted); font-size: 12px; }
      .balance-amount { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .account-details { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
      .account-details > div { flex: 1; min-width: 260px; }
      .qr { margin: 0; text-align: center; }
      .qr-code { width: 180px; height: 180px; }
      .qr-bg { fill: var(--qr-bg); }
      .qr-fg { fill: var(--qr-fg); }
      .qr figcaption { font-size: 12px; color: var(--muted); max-width: 220px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
      .bank-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
      .card-face {
        background: linear-gradient(135deg, var(--accent), #134e4a); color: #fff;
        border-radius: 10px; padding: 16px; margin-bottom: 8px; min-height: 90px;
        display: flex; flex-direction: column; justify-content: space-between;
      }
      .card-face .badge { color: #fff; border-color: rgba(255,255,255,0.5); }
      .pan { font-size: 16px; letter-spacing: 1px; }
      .card-secrets .secret:empty { display: none; }
      .card-secrets iframe { border: 0; width: 100%; height: 40px; }
      .simulated-card { padding: 8px 0; }
      .review-item { border-top: 1px solid var(--line); padding: 12px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="main.js"></script>
  </body>
</html>
